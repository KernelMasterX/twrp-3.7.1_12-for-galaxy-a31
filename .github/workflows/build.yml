name: TWRP 3.7.1_12 Latest Stable for A31

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Deps
        run: |
          sudo apt update
          sudo apt install -y repo bison flex rsync zip curl python-is-python3 \
            gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc bc unzip \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools python3 \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev git
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: Init 3.7.1 Manifest
        run: |
          mkdir ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc --all)

      - name: Clone A31 (my fork)
        run: |
          cd ~/twrp
          git clone --depth=1 https://github.com/KernelMasterX/orangefox-for-galaxy-a31.git device/samsung/a31
          find device/samsung/a31 -name mkbootimg -exec chmod +x {} \;
          echo "TW_DEVICE_VERSION := 3.7.1_12-0 A31 Latest Stable" >> device/samsung/a31/BoardConfig.mk

      - name: Build
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_a31-eng
          mka avbtool
          mka recoveryimage -j$(nproc --all)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-3.7.1_12-A31-Latest-Stable
          path: ~/twrp/out/target/product/a31/recovery.img
          if-no-files-found: error
